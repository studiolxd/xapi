name: angular-smoke

# Validates that @studiolxd/xapi/angular compiles in a real Angular AOT/production
# build — the acceptance criterion for the decorator-free, plain-ESM adapter
# (PLAN.md §8). Targets the documented floor, Angular 17.

on:
  push:
    branches: [main]
    paths:
      - 'packages/xapi/**'
      - 'tests/angular-smoke/**'
      - '.github/workflows/angular-smoke.yml'
  pull_request:
    paths:
      - 'packages/xapi/**'
      - 'tests/angular-smoke/**'
      - '.github/workflows/angular-smoke.yml'

jobs:
  aot-build:
    name: Angular 17 AOT build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must come BEFORE setup-node: `cache: pnpm` shells out to `pnpm store path`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install monorepo deps
        # No workaround needed any more: the npm/cli#4828 hack that lived here
        # (rm -f package-lock.json) existed because a macOS-generated lockfile
        # made npm skip the Linux rollup binary. pnpm records every platform
        # variant and filters at install time.
        run: pnpm install --frozen-lockfile

      - name: Build @studiolxd/xapi
        run: pnpm --filter @studiolxd/xapi run build

      - name: Pack the built library into the fixture
        # Deliberately `npm pack`, not `pnpm pack`: the smoke test must validate
        # the very artefact `npm publish` will produce.
        working-directory: packages/xapi
        run: npm pack --pack-destination ../../tests/angular-smoke

      - name: Install the Angular fixture (Angular 17 + the packed tarball)
        working-directory: tests/angular-smoke
        run: |
          npm install
          npm install ./studiolxd-xapi-*.tgz

      - name: Angular production (AOT) build
        working-directory: tests/angular-smoke
        run: npx ng build --configuration production
