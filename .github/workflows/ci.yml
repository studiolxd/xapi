name: CI

# Consolidates the ci.yml that used to live in packages/xapi/.github. GitHub
# Actions only reads .github/workflows from the repository root, so it never
# ran: typecheck, tests and builds were not validated by CI at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # Must come BEFORE setup-node: `cache: pnpm` shells out to `pnpm store path`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (library)
        run: pnpm run typecheck

      - name: Test (library)
        run: pnpm run test

      - name: Build (library)
        run: pnpm run build

      - name: Lint (example)
        run: pnpm run lint:example

      # After the library build: the example resolves @studiolxd/xapi through
      # the workspace, whose `exports` point at dist/.
      - name: Build (example)
        run: pnpm run build:example
